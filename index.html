
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PANA RADIO</title>
    <meta name="description" content="La Radio Panafricaine" />
    <meta name="author" content="Oredy Technologies" />
    <meta property="og:image" content="/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9651519664878161"
     crossorigin="anonymous"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const notifyParentOfPath = () => {
          window.parent.postMessage(
            {
              type: 'spa-path-update',
              slug: window.location.pathname
            },
            '*'
          );
        };
      
        notifyParentOfPath(); // envoyer au premier chargement
      
        // Envoyer le nouveau slug à chaque navigation (si tu utilises un routeur comme VueRouter ou ReactRouter)
        window.addEventListener('popstate', notifyParentOfPath);
        window.history.pushState = new Proxy(window.history.pushState, {
          apply: function (target, thisArg, argumentsList) {
            target.apply(thisArg, argumentsList);
            notifyParentOfPath();
          }
        });
      });
    </script>
  </body>
</html>
